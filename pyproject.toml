[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes"
version = "0.0.1"
description = "A Python framework for developing, backtesting, and deploying intraday/swing trading strategies on candlestick data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ivan Osipchyk" }]

# Kept lean; heavy/optional integrations live in extras below.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",          # Parquet cache
    "exchange-calendars>=4.5",  # Session Calendars for stocks/CFDs
    "truststore>=0.9",      # trust the OS cert store (corporate proxies) for fetches
]

[project.optional-dependencies]
# Data sources
yfinance = ["yfinance>=0.2.40"]
binance = ["python-binance>=1.0.19"]
pepperstone = ["ctrader-open-api>=0.9.2"]  # Pepperstone CFDs via cTrader Open API

# AI Advisor providers
ai = ["anthropic>=0.40"]              # default: ClaudeProvider
deepseek = ["openai>=3.19.0"]         # DeepSeekProvider (OpenAI-compatible client)

# Indicators (optional breadth on top of built-ins)
indicators = ["pandas-ta>=0.3.14b"]

# Reporting / plots
report = ["matplotlib>=3.9", "quantstats>=0.0.62"]

# Local web UI (Streamlit). Review uses the Claude Code CLI, not the API — no extra dep.
ui = ["streamlit>=1.36", "plotly>=5.22"]

# Everything for local development
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hermes = "hermes.cli:main"
hermes-ui = "hermes.webui.launch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

# Bundle the canonical skills + the docs they reference INTO the wheel (single source
# of truth stays in the repo). `hermes install-skills` materialises them into a target
# project. See ADR-0007.
[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "hermes/_skills"
"CONTEXT.md" = "hermes/_reference/CONTEXT.md"
"docs/adr" = "hermes/_reference/docs/adr"
"examples" = "hermes/_reference/examples"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B027",  # empty non-abstract methods are intentional optional lifecycle hooks (Strategy)
    "B905",  # zip() without strict= is fine where lengths are guaranteed equal
    "E741",  # `l` reads clearly as (low) / (loss) in local OHLC/math contexts
]

[tool.ruff.lint.per-file-ignores]
# Streamlit requires set_page_config()/logging setup to run before other imports.
"src/hermes/webui/app.py" = ["E402"]
"src/hermes/webui/pages/*.py" = ["E402"]
# The ContextEnricher Protocol must be defined before the submodules that
# implement it are re-exported, or the imports go circular.
"src/hermes/ai/enrichers/__init__.py" = ["E402"]
# Runnable-as-a-script strategy: the sys.path bootstrap has to precede the imports
# it enables.
"strategies/gap_breakout_sp500.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/hermes"]

# The Streamlit layer is untyped by nature (session_state, widget returns) and is
# slated to move out of the library during the agentic pivot — see docs/adr/0010.
# Everything under src/hermes/ outside webui/ is held to `strict`.
[[tool.mypy.overrides]]
module = "hermes.webui.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
