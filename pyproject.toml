[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes"
version = "0.0.1"
description = "A Python framework for developing, backtesting, and deploying intraday/swing trading strategies on candlestick data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ivan Osipchyk" }]

# Kept lean; heavy/optional integrations live in extras below.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",          # Parquet cache
    "exchange-calendars>=4.5",  # Session Calendars for stocks/CFDs
]

[project.optional-dependencies]
# Data sources
yfinance = ["yfinance>=0.2.40"]
binance = ["python-binance>=1.0.19"]
pepperstone = ["ctrader-open-api>=0.9.2"]  # Pepperstone CFDs via cTrader Open API

# AI Advisor (default provider)
ai = ["anthropic>=0.40"]

# Indicators (optional breadth on top of built-ins)
indicators = ["pandas-ta>=0.3.14b"]

# Reporting / plots
report = ["matplotlib>=3.9", "quantstats>=0.0.62"]

# Local web UI (Streamlit). Review uses the Claude Code CLI, not the API — no extra dep.
ui = ["streamlit>=1.36", "plotly>=5.22"]

# Everything for local development
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hermes-ui = "hermes.webui.launch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B027",  # empty non-abstract methods are intentional optional lifecycle hooks (Strategy)
    "B905",  # zip() without strict= is fine where lengths are guaranteed equal
    "E741",  # `l` reads clearly as (low) / (loss) in local OHLC/math contexts
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
